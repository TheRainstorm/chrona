version: 3
timezone: Asia/Shanghai
jitter_seconds: 45
policies:
  - id: fine
    label: 精细保留
    start_at: "2026-11-01T00:00:00+08:00"
    keep: {quarter_hourly: 96, hourly: 72, daily: 35, weekly: 8, monthly: 12}
  - id: ssd
    label: SSD 轻量保护
    start_at: "2026-11-01T00:00:00+08:00"
    keep: {quarter_hourly: 4, hourly: 12, daily: 7, weekly: 4, monthly: 3}
# 只配置父级，已有和新增子数据集默认继承。
datasets:
  - name: Saturn
    policy: fine
  # 本级覆盖；Immich 的后代默认继承这组规则。
  - name: Saturn/APP/Immich
    snapshot:
      start_at: "2026-11-01T00:00:00+08:00"
      keep: {quarter_hourly: 12, hourly: 24, daily: 7, weekly: 4, monthly: 12}
  - name: rpool/data
    policy: ssd
  # 显式停止这个分支的继承。
  - name: Saturn/Temporary
    snapshot_mode: none
# 公共备份策略只定义时间；本机和不同远端都可以引用同一策略。
backup_policies:
  - id: weekly
    name: 每周日备份
    cadence: weekly
    weekdays: [0]
    month_day: 1
    at: "04:00"
    grace_minutes: 60
backups:
  - id: ares-saturn
    name: Ares 系统与应用
    host: local
    policy: weekly
    enabled: true
    datasets:
      - source: rpool/data/vm-201-ares-root
        destination: Saturn/backup/ares-root
      - source: rpool/data/vm-201-ares-docker
        destination: Saturn/backup/ares-docker
  # 目标主机、端口和路径属于备份任务，不属于时间策略。
  # 备份按源数据集显式绑定，不会从父级继承。
  - id: app-vault
    name: 应用异机备份
    # 留空端口，使用运行账号 ~/.ssh/config 中的 Host / Port / User。
    # 也可以填写 backup.example.com:2202，或显式设置 port: 2202。
    host: backup-nas
    policy: weekly
    enabled: true
    datasets:
      - source: Saturn/APP/Immich
        destination: vault/APP/Immich
      - source: Saturn/APP/Seafile
        destination: vault/APP/Seafile

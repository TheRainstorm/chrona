name: CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrona-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        id: go
        with:
          go-version: stable
          cache: true
      - name: Check source and tests
        run: |
          test -z "$(gofmt -l cmd internal web)"
          go vet ./...
          go test -race ./...
          node --check web/app.js
          node --check scripts/browser-smoke.cjs
          bash -n scripts/release.sh
          python3 -m py_compile scripts/deploy/*.py

  build:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ needs.check.outputs.go-version }}
          cache: true
      - name: Build Linux release archive
        env:
          CHRONA_REF: ${{ github.ref }}
          CHRONA_TAG: ${{ github.ref_name }}
          CHRONA_ARCH: ${{ matrix.arch }}
        run: |
          version=0.0.0-dev
          if [[ "$CHRONA_REF" == refs/tags/* ]]; then
            version="$CHRONA_TAG"
          fi
          ./scripts/release.sh "$version" "$CHRONA_ARCH"
          if [[ "$CHRONA_ARCH" == amd64 ]]; then
            tar -xzf dist/chrona_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/chrona_${version#v}_linux_amd64/chrona" -version
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Publish versioned binaries and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHRONA_TAG: ${{ github.ref_name }}
        run: |
          version="${CHRONA_TAG#v}"
          assets=("chrona_${version}_linux_amd64.tar.gz" "chrona_${version}_linux_arm64.tar.gz")
          sha256sum -- "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          if gh release view "$CHRONA_TAG" >/dev/null 2>&1; then
            echo "Release $CHRONA_TAG already exists; refusing to replace published assets." >&2
            exit 1
          fi
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$CHRONA_TAG" "${assets[@]}" SHA256SUMS \
            --verify-tag --title "Chrona $CHRONA_TAG" --generate-notes "${prerelease[@]}"
